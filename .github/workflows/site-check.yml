# Static checks on every pull request and on pushes to non-main branches.
name: Site Check

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil poppler-utils
      - name: Build (dry run) + chrome + site checks
        run: bash scripts/validate-all.sh
