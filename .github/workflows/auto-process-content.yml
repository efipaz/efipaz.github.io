# Automatic content processing for efipaz.com
#
# Efi uploads files through the GitHub web UI; this workflow turns them into site content.
# All the logic lives in scripts/build_content.py (also runnable locally).
#
#   books/ transcripts/  -> covers, PDF conversion, cards on spiritual.html
#   travel/<folder>/     -> thumbnails, gallery pages, cards on travel.html
#   teachers/<id>/       -> teacher pages, cards on spiritual.html
#   archive.org          -> recordings list (weekly refresh)
#   repo root            -> misplaced uploads are moved to the right folder

name: Auto Process Content

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'transcripts/**'
      - 'travel/**'
      - 'teachers/**'
      - '*.pdf'
      - '*.PDF'
      - '*.doc'
      - '*.docx'
      - '*.DOC'
      - '*.DOCX'
      - '*.jpg'
      - '*.JPG'
      - '*.jpeg'
      - '*.JPEG'
      - '*.png'
      - '*.PNG'
      - '*.heic'
      - '*.HEIC'
      - '*.mp4'
      - '*.MP4'
      - '*.mov'
      - '*.MOV'
      - 'links.txt'
      - 'scripts/build_content.py'
      - 'scripts/sitechrome.py'
      - 'scripts/check_site.py'
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC: refresh the archive.org recordings list
  workflow_dispatch:

# Two quick uploads must never race each other.
concurrency:
  group: auto-process-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build the tip of the branch, not the commit that triggered us: Efi may have
          # pushed (or deleted a folder) again while this run was queued.
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils imagemagick libheif-examples ffmpeg libreoffice-writer libreoffice-impress \
            python3-pil
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Build, commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          # --check: run the site checks afterwards and put their findings in Efi's report
          build() {
            python3 scripts/build_content.py --check
            git add -A
            if git diff --staged --quiet; then echo "No changes to commit"; else
              git commit -m "Auto-process: update site content"; fi
          }
          build
          # If Efi pushed again while we were building, do NOT rebase our (now stale) result on
          # top of their change: start over from the new tip and build again.
          for i in 1 2 3; do
            git push && exit 0
            echo "remote moved; rebuilding on top of it ($i)"
            git fetch --depth=1 origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            git clean -fd
            build
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f content-report.md ]; then cat content-report.md >> "$GITHUB_STEP_SUMMARY"; fi
