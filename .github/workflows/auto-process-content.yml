# Automatic content processing for efipaz.com
#
# Efi uploads files through the GitHub web UI; this workflow turns them into site content.
# All the logic lives in scripts/build_content.py (also runnable locally).
#
#   books/ transcripts/  -> covers, PDF conversion, cards on spiritual.html
#   travel/<folder>/     -> thumbnails, gallery pages, cards on travel.html
#   teachers/<id>/       -> teacher pages, cards on spiritual.html
#   archive.org          -> recordings list (weekly refresh)
#   repo root            -> misplaced uploads are moved to the right folder

name: Auto Process Content

on:
  push:
    branches: [main]
    paths:
      - 'books/**'
      - 'transcripts/**'
      - 'travel/**'
      - 'teachers/**'
      - '*.pdf'
      - '*.PDF'
      - '*.doc'
      - '*.docx'
      - '*.DOC'
      - '*.DOCX'
      - '*.jpg'
      - '*.JPG'
      - '*.jpeg'
      - '*.JPEG'
      - '*.png'
      - '*.PNG'
      - '*.heic'
      - '*.HEIC'
      - '*.mp4'
      - '*.MP4'
      - '*.mov'
      - '*.MOV'
      - 'scripts/build_content.py'
      - 'scripts/sitechrome.py'
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC: refresh the archive.org recordings list
  workflow_dispatch:

# Two quick uploads must never race each other.
concurrency:
  group: auto-process-content
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            poppler-utils imagemagick libheif-examples ffmpeg libreoffice-writer libreoffice-impress \
            python3-pil
          python3 -c "import PIL; print('Pillow', PIL.__version__)"

      - name: Build site content
        run: python3 scripts/build_content.py

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-process: update site content"
          # Someone (Efi) may have pushed again while we were building.
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push failed, retrying ($i)"; sleep 10
          done
          exit 1

      - name: Summary
        if: always()
        run: |
          if [ -f content-report.md ]; then cat content-report.md >> "$GITHUB_STEP_SUMMARY"; fi
